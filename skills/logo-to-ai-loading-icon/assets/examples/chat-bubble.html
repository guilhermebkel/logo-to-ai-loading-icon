<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI loading icon in a chat bubble</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; display: grid; gap: 24px; padding: 24px;
         grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); background: #e9ecef; }
  .panel { border-radius: 16px; padding: 20px; display: grid; gap: 12px; align-content: start; }
  .light { background: #ffffff; color: #1b1e27; }
  .dark { background: #16181d; color: #e8eaf6; }
  .label { font-size: 12px; opacity: .6; text-transform: uppercase; letter-spacing: .06em; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; }
  .user { justify-self: end; background: #3b5bdb; color: #fff; border-bottom-right-radius: 4px; }
  .ai { justify-self: start; display: flex; align-items: center; gap: 10px; border-bottom-left-radius: 4px; }
  .light .ai { background: #f1f3f5; }
  .dark .ai { background: #23262e; }
  .ai img { display: block; height: 22px; width: auto; }
  .ai.big img { height: 40px; }
  .ai small { opacity: .65; }
</style>
</head>
<body>
  <section class="panel light">
    <div class="label">Light</div>
    <div class="msg user">Summarize this report for me.</div>
    <div class="msg ai"><img src="symbols-hop-fit.svg" alt="Loading"><small>Thinking…</small></div>
    <div class="msg ai big"><img src="symbols-bloom-fit.svg" alt="Loading"><small>Writing…</small></div>
  </section>
  <section class="panel dark">
    <div class="label">Dark</div>
    <div class="msg user">Summarize this report for me.</div>
    <div class="msg ai"><img src="symbols-hop-fit-dark.svg" alt="Loading"><small>Thinking…</small></div>
    <div class="msg ai big"><img src="symbols-bloom-fit-dark.svg" alt="Loading"><small>Writing…</small></div>
  </section>
</body>
</html>
