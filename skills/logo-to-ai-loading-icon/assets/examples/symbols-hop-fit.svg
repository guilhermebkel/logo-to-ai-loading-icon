<svg xmlns="http://www.w3.org/2000/svg" viewBox="-53.6 -41.6 107.3 59.3" role="img" aria-label="Loading"><title>Loading</title>
<style>
  .m { transform-box: fill-box; transform-origin: 50% 100%; }
  .ma { animation: hop-ring 1.1s ease-in-out infinite; }
  .mb { animation: hop-cross 1.1s ease-in-out infinite; animation-delay: -.12s; }
  .mc { animation: hop-ring 1.1s ease-in-out infinite; animation-delay: -.24s; }
  @keyframes hop-ring {
    0%, 100% { transform: translateY(0px) scale(1.05, .95); }
    50% { transform: translateY(-24px) scale(.97, 1.04); }
  }
  @keyframes hop-cross {
    0%, 100% { transform: translateY(0px) rotate(0deg) scale(1.05, .95); }
    50% { transform: translateY(-24px) rotate(90deg) scale(.97, 1.04); }
  }
  @media (prefers-reduced-motion: reduce) { .m { animation: none; } }
</style>
<g>
  <g transform="translate(-38 0)"><circle class="m ma" r="9.25" fill="none" stroke="#3B5BDB" stroke-width="7.50"/></g>
  <g><path class="m mb" d="M-8 -2.75H-2.75V-8H2.75V-2.75H8V2.75H2.75V8H-2.75V2.75H-8Z" fill="#3B5BDB"/></g>
  <g transform="translate(38 0)"><circle class="m mc" r="9.25" fill="none" stroke="#3B5BDB" stroke-width="7.50"/></g>
</g>
</svg>
